[package]
name = "llm-provider-openai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "OpenAI LLM Provider Tool — wraps OpenAI Chat Completion API as a Tool"

[lints]
workspace = true

[dependencies]
kernel = { path = "../../core", version = "0.1.0" }
async-trait.workspace = true
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }
serde_json.workspace = true
reqwest = { version = "0.12.24", default-features = false, features = ["json", "stream", "rustls-tls"] }

[dev-dependencies]
test-utils = { path = "../../test-utils", version = "0.1.0" }
tokio = { version = "1", features = ["rt", "macros"] }
