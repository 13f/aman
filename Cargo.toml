[profile.dev]
debug = 1 # 1 表示只保留行号信息，不保留全面的变量和类型调试信息（默认是 2）
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3 # 或 "z"

[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/macros",
  "crates/event-bus",
  "crates/dispatcher",
  "crates/pipeline",
  "crates/skill",
  "crates/workflow",
  "crates/tool",
  "crates/source",
  "crates/plugin",
  "crates/hook",
  "crates/soul",
  "crates/persistence",
  "crates/secret",
  "crates/config",
  "crates/cli",
  "crates/sdk",
  "crates/sdk/examples/hello-skill",
  "crates/tauri",
  "crates/test-utils",
  "crates/plugins/llm-provider-openai",
  "crates/plugins/memory-store",
  "crates/plugins/info-hub",
  "crates/plugins/messaging-core",
  "crates/plugins/messaging-telegram",
  "crates/plugins/messaging-slack",
  "crates/plugins/messaging-discord",
  "crates/plugins/messaging-matrix",
  "crates/gateway",
  "crates/idle",
  "crates/lifecycle",
  "crates/work",
  "crates/study",
  "crates/daily-life",
  "crates/memory",
  "crates/notification",
