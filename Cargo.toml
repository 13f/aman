[profile.dev]
debug = 1 # 1 表示只保留行号信息，不保留全面的变量和类型调试信息（默认是 2）
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3 # 或 "z"

[workspace]
resolver = "2"
members = [
  "cognitive/engine",
  "cognitive/llm",
  "cognitive/react",
  "kernel/core",
  "kernel/macros",
  "kernel/event-bus",
  "kernel/dispatcher",
  "kernel/pipeline",
  "kernel/skill",
  "kernel/workflow",
  "kernel/tool",
  "kernel/source",
  "kernel/plugin",
  "kernel/sandbox",
  "kernel/hook",
  "kernel/soul",
  "kernel/persistence",
  "kernel/secret",
  "kernel/config",
  "kernel/cli",
  "kernel/sdk",
  "kernel/sdk/examples/hello-skill",
  "desktop",
  "kernel/test-utils",
  "kernel/plugins/llm-provider-openai",
  "kernel/plugins/memory-store",
  "kernel/plugins/info-hub",
  "kernel/plugins/messaging-core",
  "kernel/plugins/messaging-telegram",
  "kernel/plugins/messaging-slack",
  "kernel/plugins/messaging-discord",
  "kernel/plugins/messaging-matrix",
  "kernel/plugins/team",
  "kernel/gateway",
  "kernel/idle",
  "kernel/lifecycle",
  "kernel/work",
  "kernel/study",
  "kernel/daily-life",
  "kernel/memory",
  "kernel/notification",
  "kernel/mcp-client",
  "kernel/skm-core-patched",
  "kernel/analytics",
  "kernel/eval",
  "kernel/context-manager",
  "shared/i18n",
