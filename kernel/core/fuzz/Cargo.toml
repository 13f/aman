[workspace]

[package]
name = "kernel-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "AGPL-3.0"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
serde_json = "1.0"

[dependencies.kernel]
path = ".."

# Prevent this from being built by normal cargo build/test/check.
# Only `cargo fuzz` builds these targets.
[[bin]]
name = "redactor"
path = "fuzz_targets/redactor.rs"
test = false
doc = false
bench = false

[[bin]]
name = "pipeline_serde"
path = "fuzz_targets/pipeline_serde.rs"
test = false
doc = false
bench = false
