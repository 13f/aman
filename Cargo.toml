[workspace]
resolver = "2"
members = [
  "crates/aman-core",
  "crates/aman-macros",
  "crates/aman-event-bus",
  "crates/aman-dispatcher",
  "crates/aman-pipeline",
  "crates/aman-skill",
  "crates/aman-workflow",
  "crates/aman-tool",
  "crates/aman-source",
  "crates/aman-plugin",
  "crates/aman-hook",
  "crates/aman-soul",
  "crates/aman-persistence",
  "crates/aman-secret",
  "crates/aman-config",
  "crates/aman-runtime",
  "crates/aman-cli",
  "crates/aman-sdk",
  "crates/aman-tauri",
]
default-members = [
  "crates/aman-core",
  "crates/aman-macros",
  "crates/aman-event-bus",
  "crates/aman-dispatcher",
  "crates/aman-pipeline",
  "crates/aman-skill",
  "crates/aman-workflow",
  "crates/aman-tool",
  "crates/aman-source",
  "crates/aman-plugin",
  "crates/aman-hook",
  "crates/aman-soul",
  "crates/aman-persistence",
  "crates/aman-secret",
  "crates/aman-config",
  "crates/aman-runtime",
  "crates/aman-cli",
  "crates/aman-sdk",
  "crates/aman-tauri",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/jerin/aman"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "0.1.89"
blake3 = "1.8.2"
humantime = "2.3.0"
pollster = "0.4.0"
proc-macro2 = "1.0.103"
quote = "1.0.41"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.108", features = ["full"] }
thiserror = "2.0.17"
trybuild = "1.0.112"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
