[workspace.package]
edition = "2024"
license = "AGPL-3.0"
version = "0.1.0"
repository = "https://github.com/jerin/aman"
rust-version = "1.91"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
# Forbid accidental use of raw print macros — always go through the
# tracing subscriber (which redacts secrets via RedactWriter) or use
# safe_println! / safe_eprintln! from kernel::redactor.
print_stdout = "deny"
print_stderr = "deny"

[workspace.dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
async-trait = "0.1.89"
axum = { version = "0.8.6", features = ["multipart"] }
blake3 = "1.8.2"
pollster = "0.4.0"
proc-macro2 = "1.0.103"
prometheus = { version = "0.13.4", default-features = false }
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.108", features = ["full"] }
thiserror = "2.0.17"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["json", "env-filter"] }
trybuild = "1.0.112"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
proptest = "1.6.0"
tonic = "0.13"
prost = "0.13"
rand = "0.8"
regex = "1"

[patch.crates-io]
skm-core = { path = "crates/skm-core-patched" }
