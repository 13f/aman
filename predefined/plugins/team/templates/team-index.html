<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — Projects</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0b0d13; color: #e0e0e0; min-height: 100vh; }
  .header { padding: 24px 32px 16px; border-bottom: 1px solid #1e2030; }
  .header h1 { font-size: 20px; font-weight: 600; }
  .header p { font-size: 13px; color: #888; margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
           gap: 16px; padding: 24px 32px; }
  .project-card { display: block; padding: 20px; background: #13151f; border: 1px solid #1e2030;
                  border-radius: 8px; text-decoration: none; color: inherit;
                  transition: border-color 0.15s; }
  .project-card:hover { border-color: #6366f1; }
  .project-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
  .project-card p { font-size: 13px; color: #888; margin-bottom: 10px; }
  .project-key { font-size: 11px; color: #555; font-family: monospace; }
  .empty { padding: 48px 32px; text-align: center; color: #666; }
</style>
</head>
<body>
<div class="header">
  <h1>$team_name</h1>
  <p>$team_description</p>
</div>
$project_items
</body>
</html>
