[package]
name = "team"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Multi-agent kanban scheduler plugin — work-item dispatch by capability matching"
publish = false

[lints]
workspace = true

[dependencies]
kernel = { path = "../../core" }
work = { path = "../../work" }
workflow = { path = "../../workflow" }
async-trait = "0.1"
axum = "0.8"
regex = "1"
rusqlite = { version = "0.37", features = ["bundled"] }
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
tokio = { version = "1", features = ["sync", "rt", "macros", "fs"] }
tracing = "0.1"
uuid = { version = "1", features = ["v7"] }

[dev-dependencies]
event-bus = { path = "../../event-bus" }
tempfile = "3"
