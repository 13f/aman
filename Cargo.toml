[profile.dev]
opt-level = 0

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = 3 # 或 "z"

[workspace]
resolver = "2"
members = [
  "crates/core",
  "crates/macros",
  "crates/event-bus",
  "crates/dispatcher",
  "crates/pipeline",
  "crates/skill",
  "crates/workflow",
  "crates/tool",
  "crates/source",
  "crates/plugin",
  "crates/hook",
  "crates/soul",
  "crates/persistence",
  "crates/secret",
  "crates/config",
  "crates/runtime",
  "crates/cli",
  "crates/sdk",
  "crates/tauri",
]
default-members = [
  "crates/core",
  "crates/macros",
  "crates/event-bus",
  "crates/dispatcher",
  "crates/pipeline",
  "crates/skill",
  "crates/workflow",
  "crates/tool",
  "crates/source",
  "crates/plugin",
  "crates/hook",
  "crates/soul",
  "crates/persistence",
  "crates/secret",
  "crates/config",
  "crates/runtime",
  "crates/cli",
  "crates/sdk",
  "crates/tauri",
]

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"
repository = "https://github.com/jerin/aman"
rust-version = "1.88"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
async-trait = "0.1.89"
blake3 = "1.8.2"
humantime = "2.3.0"
pollster = "0.4.0"
proc-macro2 = "1.0.103"
quote = "1.0.41"
semver = { version = "1.0.27", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
syn = { version = "2.0.108", features = ["full"] }
thiserror = "2.0.17"
trybuild = "1.0.112"
uuid = { version = "1.18.1", features = ["serde", "v7"] }
