[package]
name = "gateway"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "aman Gateway Daemon — standalone background process for the agent runtime"

[lints]
workspace = true

[build-dependencies]
blake3.workspace = true
serde_json.workspace = true

[dependencies]
axum = { version = "0.8.6", features = ["multipart"] }
async-trait.workspace = true
blake3.workspace = true
chat-source = { path = "../plugins/chat-source", version = "0.1.0" }
config = { path = "../config", version = "0.1.0" }
idle-system = { path = "../plugins/idle-system", version = "0.1.0" }
event-bus = { path = "../event-bus", version = "0.1.0" }
hook = { path = "../hook", version = "0.1.0" }
idle = { path = "../idle", version = "0.1.0" }
kernel = { path = "../core", version = "0.1.0" }
llm-provider-openai = { path = "../plugins/llm-provider-openai", version = "0.1.0" }
notification = { path = "../notification", version = "0.1.0" }
persistence = { path = "../persistence", version = "0.1.0" }
pipeline = { path = "../pipeline", version = "0.1.0" }
plugin = { path = "../plugin", version = "0.1.0" }
pollster.workspace = true
prometheus.workspace = true
secret = { path = "../secret", version = "0.1.0" }
soul = { path = "../soul", version = "0.1.0" }
source = { path = "../source", version = "0.1.0" }
skill = { path = "../skill", version = "0.1.0" }
tool = { path = "../tool", version = "0.1.0" }
workflow = { path = "../workflow", version = "0.1.0" }
serde.workspace = true
skm-core = "0.1.0"
skm-embed = "0.1.0"
skm-select = "0.1.0"
serde_json.workspace = true
serde_yaml = "0.9.34"
tokio = { version = "1", features = ["net", "rt", "rt-multi-thread", "signal", "sync", "macros", "time"] }
tower = { version = "0.5.2", features = ["util"] }
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
rusqlite = { version = "0.32.1", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "rustls-tls"] }
futures-util = { version = "0.3", default-features = false, features = ["async-await"] }
