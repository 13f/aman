  "kernel/tool",
  "kernel/source",
  "kernel/plugin",
  "kernel/sandbox",
  "kernel/hook",
  "kernel/soul",
  "kernel/persistence",
  "kernel/secret",
  "kernel/config",
  "kernel/context-manager",
  "shared/i18n",
  "kernel/cli",
  "kernel/sdk",
  "kernel/sdk/examples/hello-skill",
  "desktop",
  "kernel/test-utils",
  "kernel/plugins/llm-provider-openai",
  "kernel/plugins/memory-store",
  "kernel/plugins/info-hub",
