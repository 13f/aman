[package]
name = "cli"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
config = { path = "../config", version = "0.1.0" }
kernel = { path = "../core", version = "0.1.0" }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "multipart", "rustls-tls"] }
gateway = { path = "../gateway", version = "0.1.0" }
skill = { path = "../skill", version = "0.1.0" }
serde_json.workspace = true
serde_yaml = "0.9.34"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "time"] }
tonic.workspace = true
prost.workspace = true

[build-dependencies]
tonic-build = "0.13"

[[bin]]
name = "aman"
path = "src/main.rs"
