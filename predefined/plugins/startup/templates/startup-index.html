<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Startup — Aman</title>
  <link rel="stylesheet" href="/startup/static/startup.css">
  <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.14.1/dist/cdn.min.js"></script>
  <script src="/startup/static/startup.js" defer></script>
</head>
<body x-data="startupNav()" class="startup-layout">

  <!-- Left Sidebar Navigation -->
  <nav class="sidebar">
    <div class="sidebar-header">
      <h2>&#128640; Startup</h2>
      <span class="idea-count" x-text="activeCount + ' ideas'"></span>
    </div>

    <!-- Layer Navigation -->
    <template x-for="layer in layers" :key="layer.name">
      <div class="nav-layer">
        <button class="nav-layer-btn"
                @click="toggle(layer.name)"
                :aria-expanded="isOpen(layer.name)">
          <span class="layer-icon" x-text="layer.icon"></span>
          <span class="layer-label" x-text="layer.label"></span>
          <span class="layer-chevron">▾</span>
        </button>

        <ul x-show="isOpen(layer.name)" class="nav-modules">
          <template x-for="mod in layer.modules" :key="mod.id">
            <li>
              <a :href="mod.url"
                 :class="{ active: currentModule === mod.id }"
                 @click.prevent="navigate(mod)">
                <span class="module-icon" x-text="mod.icon"></span>
                <span class="module-label" x-text="mod.label"></span>
                <span x-show="mod.badge" class="badge" x-text="mod.badge"></span>
              </a>
            </li>
          </template>
        </ul>
      </div>
    </template>

    <!-- Quick Actions -->
    <div class="sidebar-footer">
      <button class="btn-primary" @click="showValidateModal = true">
        + New Evaluation
      </button>
    </div>
  </nav>

  <!-- Main Content Area -->
  <main class="content" id="main-content">
    <!-- Validate Modal -->
    <div x-show="showValidateModal" class="modal-overlay" @click.self="showValidateModal = false">
      <div class="modal">
        <h3>Evaluate an Idea</h3>
        <form @submit.prevent="submitValidate">
          <label>Idea Slug
            <input type="text" x-model="validateForm.slug"
                   placeholder="habit-tracker-climbers" required
                   pattern="[a-z0-9]([a-z0-9-]*[a-z0-9])?">
          </label>
          <label>Description
            <textarea x-model="validateForm.description" rows="3"
                      placeholder="A habit tracker for rock climbers that..."></textarea>
          </label>
          <label>Keywords (comma-separated)
            <input type="text" x-model="validateForm.keywords"
                   placeholder="habit tracker, climbing, fitness">
          </label>
          <label>Niche
            <input type="text" x-model="validateForm.niche"
                   placeholder="fitness">
          </label>
          <div class="modal-actions">
            <button type="button" class="btn-secondary" @click="showValidateModal = false">Cancel</button>
            <button type="submit" class="btn-primary">Validate</button>
          </div>
        </form>
      </div>
    </div>

    <!-- Default Content: Idea Grid -->
    <div class="content-header">
      <h1>Your Ideas</h1>
      <span class="idea-total" x-text="ideaCount + ' total'"></span>
    </div>

    <div class="idea-grid" id="idea-grid">
      $idea_cards
    </div>
  </main>

</body>
</html>
