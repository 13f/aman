  "crates/hook",
  "crates/soul",
  "crates/persistence",
  "crates/secret",
  "crates/config",
  "crates/context-manager",
  "crates/cli",
  "crates/sdk",
  "crates/sdk/examples/hello-skill",
  "crates/tauri",
  "crates/test-utils",
  "crates/plugins/llm-provider-openai",
