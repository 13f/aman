[package]
name = "mcp-client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "MCP (Model Context Protocol) client for aman — connect to external MCP servers and expose their tools"

[lints]
workspace = true

[dependencies]
rmcp = { version = "1", features = ["client", "transport-child-process", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
tokio = { version = "1", features = ["process", "sync", "time"] }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
kernel = { path = "../core" }
tool = { path = "../tool" }
async-trait.workspace = true
thiserror.workspace = true
http = "1"
tracing.workspace = true
