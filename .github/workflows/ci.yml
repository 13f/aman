name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  test:
    name: Test (stable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install system deps (Tauri)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            libdbus-1-dev \
            libayatana-appindicator3-dev
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared/frontend/chat-input/package-lock.json
            shared/frontend/agent-selector/package-lock.json
      - name: Install frontend npm deps
        run: |
          npm ci --prefix shared/frontend/chat-input
          npm ci --prefix shared/frontend/agent-selector
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: clippy
        run: cargo clippy --workspace -- -D warnings
      - name: test
        run: cargo test --workspace
      - name: doc
        run: cargo doc --workspace --no-deps
      - name: build (release)
        run: cargo build --release --workspace

  # Run on macOS too since Tauri targets it
  test-macos:
    name: Test (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            shared/frontend/chat-input/package-lock.json
            shared/frontend/agent-selector/package-lock.json
      - name: Install frontend npm deps
        run: |
          npm ci --prefix shared/frontend/chat-input
          npm ci --prefix shared/frontend/agent-selector
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable
      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
      - name: test
        run: cargo test --workspace
