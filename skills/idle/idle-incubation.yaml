name: idle-incubation
version: "1.0.0"
description: >
  Deep idle state. Engaged arousal decay (multiplier: 0.1) — very slow attenuation.
  Creative incubation: subconscious processing, novel connections between unrelated memories.
  Only one incubation session runs at a time.
triggers:
  - event_types: ["idle"]
    sources: ["idle.system"]
concurrency: serial
