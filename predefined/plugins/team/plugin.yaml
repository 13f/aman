name: "team"
version: "0.1.0"
description: "Kanban scheduler plugin — no chat, pure Work system interaction"
isolation: subprocess
runtime: python3
min_version: ">=3.11"
entrypoint: "main.py"
lifecycle:
  auto_start: true
ui:
  pages:
    - "team"
  events:
    - "team:work_item.updated"
    - "team:safety.alert"

# team plugin needs event pub/sub for work item updates, and filesystem
# access for its SQLite database. Communication is via stdin/stdout JSON-RPC
# so no network access is needed.
security:
  requested_capabilities:
    publish_events: true
    subscribe_events: true
    read_paths:
      - "templates/"
      - "static/"
      - "${project.work_dir}/"
    write_paths:
      - "data/"
      - "${project.work_dir}/"
