<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team — Projects</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
         background: #0b0d13; color: #e0e0e0; min-height: 100vh; }
  .header { padding: 24px 32px 16px; border-bottom: 1px solid #1e2030; }
  .header-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; }
  .header-info { flex: 1; }
  .header-info h1 { font-size: 20px; font-weight: 600; cursor: pointer; padding: 2px 6px; margin: -2px -6px; border-radius: 4px; }
  .header-info h1:hover { background: #1a1d2b; }
  .header-info p { font-size: 13px; color: #888; margin-top: 4px; cursor: pointer; padding: 2px 6px; margin-left: -6px; margin-right: -6px; border-radius: 4px; }
  .header-info p:hover { background: #1a1d2b; }
  .header-info input, .header-info textarea { width: 100%; padding: 4px 8px; background: #0f1119;
    border: 1px solid #6366f1; border-radius: 4px; color: #e0e0e0; font-size: inherit;
    font-family: inherit; }
  .header-info textarea { resize: vertical; min-height: 40px; font-size: 13px; margin-top: 4px; }
  .header-info .edit-actions { display: flex; gap: 6px; margin-top: 6px; }
  .header-info .edit-actions button { padding: 4px 10px; border-radius: 4px; border: 1px solid #2a2d3a;
    background: #1a1d2b; color: #ccc; cursor: pointer; font-size: 11px; }
  .header-info .edit-actions button.save { background: #6366f1; border-color: #6366f1; color: #fff; }
  .header-actions { display: flex; gap: 8px; flex-shrink: 0; }
  .btn { padding: 7px 14px; border-radius: 6px; border: 1px solid #2a2d3a;
    background: #1a1d2b; color: #ccc; cursor: pointer; font-size: 12px; text-decoration: none;
    display: inline-flex; align-items: center; gap: 4px; }
  .btn:hover { border-color: #555; color: #e0e0e0; }
  .btn.primary { background: #6366f1; border-color: #6366f1; color: #fff; }
  .btn.primary:hover { opacity: 0.85; }
  .btn.danger { color: #ef4444; }
  .btn.danger:hover { border-color: #ef4444; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
           gap: 16px; padding: 24px 32px; }
  .project-card { display: block; padding: 20px; background: #13151f; border: 1px solid #1e2030;
                  border-radius: 8px; text-decoration: none; color: inherit; position: relative;
                  transition: border-color 0.15s; }
  .project-card:hover { border-color: #6366f1; }
  .project-card h2 { font-size: 16px; font-weight: 600; margin-bottom: 6px; padding-right: 60px; }
  .project-card p { font-size: 13px; color: #888; margin-bottom: 10px; padding-right: 60px; }
  .project-key { font-size: 11px; color: #555; font-family: monospace; }
  .card-actions { position: absolute; top: 14px; right: 14px; display: flex; gap: 4px;
                  opacity: 0; transition: opacity 0.15s; }
  .project-card:hover .card-actions { opacity: 1; }
  .card-actions button { width: 26px; height: 26px; padding: 0; background: #1a1d2b;
    border: 1px solid #2a2d3a; border-radius: 4px; color: #888; cursor: pointer;
    font-size: 13px; line-height: 1; display: flex; align-items: center; justify-content: center; }
  .card-actions button:hover { color: #e0e0e0; border-color: #555; }
  .card-actions button.del:hover { color: #ef4444; border-color: #ef4444; }
  .empty { padding: 48px 32px; text-align: center; color: #666; }
  .empty a { color: #6366f1; }

  .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
           z-index: 100; align-items: center; justify-content: center; }
  .modal.open { display: flex; }
  .modal-card { background: #13151f; border: 1px solid #1e2030; border-radius: 10px;
                padding: 24px; width: 420px; max-width: 90vw; }
  .modal-card h3 { font-size: 15px; margin-bottom: 16px; }
  .modal-card .form-group { margin-bottom: 12px; }
  .modal-card .form-group label { display: block; font-size: 12px; color: #aaa; margin-bottom: 4px; }
  .modal-card .form-group input, .modal-card .form-group textarea { width: 100%; padding: 8px 10px;
    background: #0b0d13; border: 1px solid #2a2d3a; border-radius: 6px;
    color: #e0e0e0; font-size: 13px; font-family: inherit; }
  .modal-card .form-group textarea { resize: vertical; min-height: 60px; }
  .modal-card .form-group .hint { font-size: 11px; color: #555; margin-top: 4px; }
  .modal-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 16px; }
  .modal-actions button { padding: 6px 14px; border-radius: 6px; border: 1px solid #2a2d3a;
    background: #1a1d2b; color: #e0e0e0; cursor: pointer; font-size: 12px; }
  .modal-actions button.primary { background: #6366f1; border-color: #6366f1; }
  .modal-actions button.danger { background: #7f1d1d; border-color: #7f1d1d; color: #fca5a5; }

  .flash { position: fixed; top: 16px; right: 16px; padding: 10px 16px; border-radius: 6px;
           font-size: 13px; z-index: 200; max-width: 360px; }
  .flash.success { background: #064e3b; border: 1px solid #065f46; color: #6ee7b7; }
  .flash.error { background: #450a0a; border: 1px solid #7f1d1d; color: #fca5a5; }

  .confirm-overlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6);
                     z-index: 150; align-items: center; justify-content: center; }
  .confirm-overlay.open { display: flex; }
  .confirm-box { background: #13151f; border: 1px solid #1e2030; border-radius: 10px;
                 padding: 24px; width: 360px; max-width: 90vw; text-align: center; }
  .confirm-box p { font-size: 14px; margin-bottom: 16px; }
  .confirm-box .confirm-actions { display: flex; gap: 8px; justify-content: center; }
  .confirm-box button { padding: 6px 14px; border-radius: 6px; border: 1px solid #2a2d3a;
    background: #1a1d2b; color: #e0e0e0; cursor: pointer; font-size: 12px; }
  .confirm-box button.danger { background: #7f1d1d; border-color: #7f1d1d; color: #fca5a5; }
</style>
</head>
<body>
<div class="header">
  <div class="header-row">
    <div class="header-info">
      <h1 id="teamNameDisplay" onclick="editTeamName()">$team_name</h1>
      <div id="teamNameEdit" style="display:none">
        <input type="text" id="teamNameInput">
        <div class="edit-actions">
          <button class="save" onclick="saveTeamName()">Save</button>
          <button onclick="cancelTeamName()">Cancel</button>
        </div>
      </div>
      <p id="teamDescDisplay" onclick="editTeamDesc()">$team_description</p>
      <div id="teamDescEdit" style="display:none">
        <textarea id="teamDescInput" rows="2"></textarea>
        <div class="edit-actions">
          <button class="save" onclick="saveTeamDesc()">Save</button>
          <button onclick="cancelTeamDesc()">Cancel</button>
        </div>
      </div>
    </div>
    <div class="header-actions">
      <a href="/api/v1/team/setup" class="btn">Setup Wizard</a>
      <button class="btn primary" onclick="openCreateModal()">+ New Project</button>
    </div>
  </div>
</div>
<div class="grid" id="projectGrid">
  $project_items
</div>

<!-- Edit Project Modal -->
<div class="modal" id="editModal">
  <div class="modal-card">
    <h3>Edit Project</h3>
    <div class="form-group">
      <label>Project Name</label>
      <input type="text" id="editProjName">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="editProjDesc" rows="2"></textarea>
    </div>
    <div class="form-group">
      <label>Project Key</label>
      <input type="text" id="editProjKey" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')">
      <div class="hint">Changing the key renames the project folder. You will be redirected to the new URL.</div>
    </div>
    <div class="form-group">
      <label>Working Directory</label>
      <input type="text" id="editWorkDir" placeholder="/path/to/project">
    </div>
    <div class="modal-actions">
      <button onclick="closeEditModal()">Cancel</button>
      <button class="primary" onclick="saveProject()">Save</button>
    </div>
  </div>
</div>

<!-- Create Project Modal -->
<div class="modal" id="createModal">
  <div class="modal-card">
    <h3>Create Project</h3>
    <div class="form-group">
      <label>Project Name</label>
      <input type="text" id="createProjName" placeholder="e.g. Aman Framework">
    </div>
    <div class="form-group">
      <label>Project Key <span class="hint">(short, lowercase — used in URLs)</span></label>
      <input type="text" id="createProjKey" placeholder="e.g. aman-core" oninput="this.value=this.value.toLowerCase().replace(/[^a-z0-9-]/g,'')">
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="createProjDesc" rows="2" placeholder="Optional"></textarea>
    </div>
    <div class="form-group">
      <label>Working Directory <span class="hint">(required — project files location)</span></label>
      <input type="text" id="createWorkDir" placeholder="/path/to/project">
    </div>
    <div class="modal-actions">
      <button onclick="closeCreateModal()">Cancel</button>
      <button class="primary" onclick="createProject()">Create</button>
    </div>
  </div>
</div>

<!-- Delete Confirmation -->
<div class="confirm-overlay" id="confirmDelete">
  <div class="confirm-box">
    <p>Delete project <strong id="delProjName"></strong>?</p>
    <p style="font-size:12px;color:#888;">This permanently removes the project folder and all data.</p>
    <div class="confirm-actions">
      <button onclick="closeConfirm()">Cancel</button>
      <button class="danger" id="confirmDeleteBtn">Delete</button>
    </div>
  </div>
</div>

<div id="flash"></div>

<script>
var editingProjectKey = "";
var deletingProjectKey = "";

// ── Team name/description inline editing ──────────────────────

function editTeamName() {
  document.getElementById("teamNameDisplay").style.display = "none";
  document.getElementById("teamNameEdit").style.display = "block";
  document.getElementById("teamNameInput").value = document.getElementById("teamNameDisplay").textContent;
  document.getElementById("teamNameInput").focus();
}

function cancelTeamName() {
  document.getElementById("teamNameDisplay").style.display = "";
  document.getElementById("teamNameEdit").style.display = "none";
}

async function saveTeamName() {
  var val = document.getElementById("teamNameInput").value.trim();
  if (!val) return;
  try {
    var r = await fetch("/api/v1/team/update", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({team_name: val})
    });
    if (!r.ok) { var e = await r.json(); throw new Error(e.error || "Save failed"); }
    document.getElementById("teamNameDisplay").textContent = val;
    cancelTeamName();
    flash("Team name updated", "success");
  } catch(e) { flash(e.message, "error"); }
}

function editTeamDesc() {
  document.getElementById("teamDescDisplay").style.display = "none";
  document.getElementById("teamDescEdit").style.display = "block";
  document.getElementById("teamDescInput").value = document.getElementById("teamDescDisplay").textContent;
  document.getElementById("teamDescInput").focus();
}

function cancelTeamDesc() {
  document.getElementById("teamDescDisplay").style.display = "";
  document.getElementById("teamDescEdit").style.display = "none";
}

async function saveTeamDesc() {
  var val = document.getElementById("teamDescInput").value.trim();
  var name = document.getElementById("teamNameDisplay").textContent;
  try {
    var r = await fetch("/api/v1/team/update", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({team_name: name, description: val})
    });
    if (!r.ok) { var e = await r.json(); throw new Error(e.error || "Save failed"); }
    document.getElementById("teamDescDisplay").textContent = val || " ";
    cancelTeamDesc();
    flash("Team description updated", "success");
  } catch(e) { flash(e.message, "error"); }
}

// ── Project create ────────────────────────────────────────────

function openCreateModal() {
  document.getElementById("createProjName").value = "";
  document.getElementById("createProjKey").value = "";
  document.getElementById("createProjDesc").value = "";
  document.getElementById("createWorkDir").value = "";
  document.getElementById("createModal").classList.add("open");
  setTimeout(function(){ document.getElementById("createProjName").focus(); }, 100);
}

function closeCreateModal() {
  document.getElementById("createModal").classList.remove("open");
}

async function createProject() {
  var name = document.getElementById("createProjName").value.trim();
  var key = document.getElementById("createProjKey").value.trim();
  var desc = document.getElementById("createProjDesc").value.trim();
  var workDir = document.getElementById("createWorkDir").value.trim();
  if (!name) { flash("Project name is required", "error"); return; }
  if (!key) { flash("Project key is required", "error"); return; }
  if (!workDir) { flash("Working directory is required", "error"); return; }

  try {
    var r = await fetch("/api/v1/team/projects/create", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({
        project_key: key,
        project_name: name,
        description: desc,
        work_dir: workDir,
        stages: [
          {id: "todo", name: "Todo", allowed_next: ["doing"]},
          {id: "doing", name: "Doing", allowed_next: ["done"]},
          {id: "done", name: "Done", allowed_next: []}
        ],
        initial_stage: "todo"
      })
    });
    if (!r.ok) { var e = await r.json(); throw new Error(e.error || "Create failed"); }
    closeCreateModal();
    flash("Project created", "success");
    setTimeout(function(){ window.location.href = "/api/v1/team/projects/" + encodeURIComponent(key); }, 600);
  } catch(e) { flash(e.message, "error"); }
}

// ── Project edit ──────────────────────────────────────────────

function openEditModal(key, name, desc, workDir) {
  editingProjectKey = key;
  document.getElementById("editProjName").value = name;
  document.getElementById("editProjDesc").value = desc || "";
  document.getElementById("editProjKey").value = key;
  document.getElementById("editWorkDir").value = workDir || "";
  document.getElementById("editModal").classList.add("open");
}

function closeEditModal() {
  document.getElementById("editModal").classList.remove("open");
  editingProjectKey = "";
}

async function saveProject() {
  var name = document.getElementById("editProjName").value.trim();
  var desc = document.getElementById("editProjDesc").value.trim();
  var newKey = document.getElementById("editProjKey").value.trim();
  var workDir = document.getElementById("editWorkDir").value.trim();
  if (!name || !newKey) return;

  try {
    var r = await fetch("/api/v1/team/projects/" + encodeURIComponent(editingProjectKey) + "/update", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({project_name: name, description: desc, project_key: newKey, work_dir: workDir})
    });
    if (!r.ok) { var e = await r.json(); throw new Error(e.error || "Save failed"); }
    var data = await r.json();
    closeEditModal();
    flash("Project updated", "success");
    if (data.redirect) {
      setTimeout(function(){ window.location.href = data.redirect; }, 600);
    } else {
      setTimeout(function(){ window.location.reload(); }, 600);
    }
  } catch(e) { flash(e.message, "error"); }
}

// ── Project delete ────────────────────────────────────────────

function confirmDelete(key, name) {
  deletingProjectKey = key;
  document.getElementById("delProjName").textContent = name;
  document.getElementById("confirmDelete").classList.add("open");
}

function closeConfirm() {
  document.getElementById("confirmDelete").classList.remove("open");
  deletingProjectKey = "";
}

async function doDelete() {
  if (!deletingProjectKey) return;
  try {
    var r = await fetch("/api/v1/team/projects/" + encodeURIComponent(deletingProjectKey), {
      method: "DELETE"
    });
    if (!r.ok) { var e = await r.json(); throw new Error(e.error || "Delete failed"); }
    closeConfirm();
    flash("Project deleted", "success");
    setTimeout(function(){ window.location.reload(); }, 600);
  } catch(e) { flash(e.message, "error"); }
}

document.getElementById("confirmDeleteBtn").addEventListener("click", doDelete);

// ── Flash ─────────────────────────────────────────────────────

function flash(msg, type) {
  var el = document.getElementById("flash");
  el.className = "flash " + (type || "success");
  el.textContent = msg;
  setTimeout(function(){ el.className = ""; el.textContent = ""; }, 3500);
}

// Notify parent app of current URL so it can restore this page on revisit
if (window.parent !== window) {
  window.parent.postMessage({type: "aman:team-url", url: window.location.pathname}, "*");
}
</script>
</body>
</html>
